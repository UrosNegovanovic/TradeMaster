name: E2E (Playwright)

# Public, read-only smoke against every successful Vercel deployment (preview and production),
# and on demand against any URL. Signed-in suites run locally against a test database (e2e/README.md):
# Vercel previews share the production database, so CI never writes there.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL to test (e.g. https://trade-master-seven.vercel.app)'
        required: true

concurrency:
  group: e2e-${{ github.event.deployment_status.environment_url || inputs.base_url }}
  cancel-in-progress: true

jobs:
  public-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=public-desktop --project=public-mobile
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
